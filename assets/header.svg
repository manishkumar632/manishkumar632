<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#9d7cd8"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <style>
    .w1{animation:m1 7s ease-in-out infinite alternate}
    .w2{animation:m2 9s ease-in-out infinite alternate}
    .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#fff;text-anchor:middle}
    .n{font-size:46px;font-weight:700;animation:f 1.4s ease-out both}
    .d{font-size:18px;font-weight:500;letter-spacing:1px;animation:f 1.4s .4s ease-out both}
    @keyframes m1{from{transform:translateX(0)}to{transform:translateX(-60px)}}
    @keyframes m2{from{transform:translateX(-60px)}to{transform:translateX(0)}}
    @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  </style>
  <rect width="900" height="180" fill="url(#g)"/>
  <path class="w2" fill="url(#g2)" d="M-60 140 C 90 105, 210 175, 360 140 S 630 105, 780 140 S 960 170, 1020 140 V180 H-60 Z"/>
  <path class="w1" fill="#ffffff" d="M-60 155 C 90 125, 240 185, 390 155 S 660 125, 810 155 S 990 180, 1020 155 V180 H-60 Z"/>
  <text class="t n" x="450" y="78">Manish Kumar</text>
  <text class="t d" x="450" y="110">Full-Stack &amp; Flutter App Developer</text>
</svg>
