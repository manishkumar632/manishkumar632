<style>
.swing{transform-origin:200px 0;animation:swing 3.2s ease-in-out infinite}
@keyframes swing{0%{transform:rotate(9deg)}50%{transform:rotate(-9deg)}100%{transform:rotate(9deg)}}
.sh{animation:sh 4s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(-320px)}60%,100%{transform:translateX(320px)}}
.blink{animation:bl 1.6s step-end infinite}@keyframes bl{50%{opacity:0}}
</style>
